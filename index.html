<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cityscape AI — Your AI Recruiter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ---------- Tokens ---------- */
  :root {
    --green: #4a7c59;
    --green-hover: #3d6b4a;
    --charcoal: #1a2332;
    --white: #ffffff;
    --bg: #f5f5f5;
    --grey-100: #ececec;
    --grey-200: #d8d8d8;
    --grey-400: #8a8f97;
    --grey-600: #4a4f57;
    --shadow-card: 0 1px 2px rgba(26, 35, 50, 0.04), 0 4px 16px rgba(26, 35, 50, 0.06);
    --shadow-header: 0 1px 0 rgba(26, 35, 50, 0.06);
    --radius: 14px;
    --radius-sm: 10px;
    --header-h: 68px;
    --input-h: 84px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 400;
    color: var(--charcoal);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
  }

  /* ---------- Header ---------- */
  .header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--header-h);
    background: var(--white);
    box-shadow: var(--shadow-header);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    z-index: 100;
  }
  .logo {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--charcoal);
  }
  .logo .accent { color: var(--green); }
  .tagline {
    font-size: 14px;
    font-weight: 500;
    color: var(--green);
    letter-spacing: 0.01em;
  }

  /* ---------- Chat area ---------- */
  .chat-shell {
    position: fixed;
    top: var(--header-h);
    bottom: var(--input-h);
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    overflow: hidden;
  }
  .chat-window {
    width: 100%;
    max-width: 720px;
    padding: 28px 24px 12px;
    overflow-y: auto;
    scroll-behavior: smooth;
  }
  .chat-window::-webkit-scrollbar { width: 8px; }
  .chat-window::-webkit-scrollbar-thumb { background: var(--grey-200); border-radius: 8px; }
  .chat-window::-webkit-scrollbar-track { background: transparent; }

  /* ---------- Messages ---------- */
  .msg {
    display: flex;
    margin-bottom: 14px;
    animation: msgIn 0.4s var(--ease);
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user { justify-content: flex-end; }
  .msg.ai { justify-content: flex-start; }

  .bubble {
    max-width: 78%;
    padding: 13px 17px;
    line-height: 1.5;
    font-size: 15px;
    word-wrap: break-word;
  }
  .msg.user .bubble {
    background: var(--green);
    color: var(--white);
    border-radius: 18px 18px 4px 18px;
    box-shadow: 0 1px 2px rgba(74, 124, 89, 0.18);
  }
  .msg.ai .bubble {
    background: var(--white);
    color: var(--charcoal);
    border-radius: 4px 18px 18px 18px;
    box-shadow: var(--shadow-card);
  }
  .msg.ai .bubble p { margin: 0; }
  .msg.ai .bubble p + p { margin-top: 8px; }

  /* ---------- Typing indicator ---------- */
  .typing {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--white);
    padding: 14px 18px;
    border-radius: 4px 18px 18px 18px;
    box-shadow: var(--shadow-card);
  }
  .typing .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    opacity: 0.4;
    animation: pulse 1.3s infinite ease-in-out;
  }
  .typing .dot:nth-child(2) { animation-delay: 0.2s; }
  .typing .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse {
    0%, 60%, 100% { transform: scale(0.85); opacity: 0.4; }
    30% { transform: scale(1.15); opacity: 1; }
  }

  /* ---------- CV Upload zone ---------- */
  .cv-upload {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    padding: 22px;
    max-width: 78%;
    margin: 0;
  }
  .cv-dropzone {
    border: 2px dashed var(--grey-200);
    border-radius: var(--radius-sm);
    padding: 28px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s var(--ease);
    background: var(--bg);
  }
  .cv-dropzone:hover,
  .cv-dropzone.dragover {
    border-color: var(--green);
    background: rgba(74, 124, 89, 0.04);
    transform: translateY(-1px);
  }
  .cv-dropzone .upload-icon {
    width: 36px;
    height: 36px;
    margin: 0 auto 10px;
    color: var(--green);
  }
  .cv-dropzone .label {
    font-size: 14px;
    font-weight: 500;
    color: var(--charcoal);
    margin-bottom: 4px;
  }
  .cv-dropzone .hint {
    font-size: 12px;
    color: var(--grey-400);
  }
  .cv-skip {
    display: block;
    margin: 12px auto 0;
    background: none;
    border: none;
    font-family: inherit;
    font-size: 13px;
    color: var(--grey-400);
    cursor: pointer;
    padding: 4px 8px;
    transition: color 0.2s;
  }
  .cv-skip:hover { color: var(--charcoal); }

  .cv-uploaded {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: rgba(74, 124, 89, 0.08);
    border-radius: var(--radius-sm);
    animation: msgIn 0.4s var(--ease);
  }
  .cv-tick {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--green);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    animation: tickPop 0.5s var(--ease);
  }
  @keyframes tickPop {
    0% { transform: scale(0); }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  .cv-tick svg { width: 16px; height: 16px; stroke-width: 3; }
  .cv-filename {
    font-size: 14px;
    font-weight: 500;
    color: var(--charcoal);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ---------- Final loader ---------- */
  .finalizing {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
    text-align: center;
    animation: msgIn 0.5s var(--ease);
  }
  .finalizing .ring {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 3px solid rgba(74, 124, 89, 0.18);
    border-top-color: var(--green);
    animation: spin 0.9s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .finalizing .text {
    font-size: 15px;
    font-weight: 500;
    color: var(--charcoal);
    animation: textPulse 1.8s ease-in-out infinite;
  }
  @keyframes textPulse {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }

  /* ---------- Input bar ---------- */
  .input-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: var(--input-h);
    background: var(--white);
    border-top: 1px solid var(--grey-100);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 24px;
    z-index: 100;
  }
  .input-inner {
    width: 100%;
    max-width: 720px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .input-field {
    flex: 1;
    height: 48px;
    padding: 0 18px;
    border: 1px solid var(--grey-200);
    border-radius: 24px;
    background: var(--bg);
    font-family: inherit;
    font-size: 15px;
    color: var(--charcoal);
    outline: none;
    transition: all 0.2s var(--ease);
  }
  .input-field:focus {
    border-color: var(--green);
    background: var(--white);
    box-shadow: 0 0 0 3px rgba(74, 124, 89, 0.12);
  }
  .input-field:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .send-btn {
    height: 48px;
    padding: 0 22px;
    background: var(--green);
    color: white;
    border: none;
    border-radius: 24px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s var(--ease);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .send-btn:hover:not(:disabled) {
    background: var(--green-hover);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(74, 124, 89, 0.25);
  }
  .send-btn:active:not(:disabled) { transform: translateY(0); }
  .send-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .send-btn svg { width: 16px; height: 16px; }

  /* ---------- Mobile ---------- */
  @media (max-width: 640px) {
    :root { --header-h: 60px; --input-h: 76px; }
    .header { padding: 0 18px; }
    .logo { font-size: 19px; }
    .tagline { font-size: 12px; }
    .chat-window { padding: 20px 14px 8px; }
    .bubble { max-width: 86%; font-size: 14.5px; }
    .cv-upload { max-width: 92%; padding: 18px; }
    .input-bar { padding: 0 14px; }
    .input-field { font-size: 16px; } /* prevent iOS zoom */
    .send-btn { padding: 0 18px; }
    .send-btn .send-label { display: none; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="logo">Cityscape<span class="accent">AI</span></div>
  <div class="tagline">Your AI Recruiter</div>
</header>

<div class="chat-shell">
  <div class="chat-window" id="chatWindow"></div>
</div>

<div class="input-bar">
  <div class="input-inner">
    <input
      id="messageInput"
      class="input-field"
      type="text"
      placeholder="Type your message…"
      autocomplete="off"
    />
    <button id="sendBtn" class="send-btn">
      <span class="send-label">Send</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</div>

<script>
  // ============================================================
  // CONFIGURATION
  // The API key lives on the server as an environment variable.
  // This page calls our own serverless proxy at /api/chat.
  // ============================================================
  const CHAT_ENDPOINT = '/api/chat';
  const ANTHROPIC_MODEL = 'claude-sonnet-4-20250514';

  // ============================================================
  // SYSTEM PROMPT
  // ============================================================
  const SYSTEM_PROMPT = `You are Cityscape AI, the intelligent intake assistant for Cityscape Recruitment — a specialist UK construction recruitment agency placing professionals across Building, Civil Engineering, Fit Out & Refurbishment, and Residential Development.

Your job is to have a warm, natural, recruiter-quality intake conversation with a candidate. You are NOT a form. You sound like an experienced recruiter having a friendly coffee chat — curious, knowledgeable about construction, and genuinely interested in the person in front of you.

## CONVERSATION STRUCTURE

Work in exactly 3 beats. Never ask more than one thing per message. React naturally to what they say before moving on. Use their name once you know it.

BEAT 1 — THE HELLO (target: 2 exchanges)
Open with a warm, brief welcome as Cityscape AI. Then ask ONE open question to let them introduce themselves — something like "To get started, tell me a little about yourself and what you're looking for?" A good candidate will volunteer their role, experience level, and sector. Extract as much as you can from their answer. Only ask a follow-up if critical information is missing (specialism, sector, or years of experience). Map their specialism to one of: Buyer, Civil Engineer, Consultant, Contracts Manager, Design Manager, Estimator, Foreman, Health & Safety, Planner, Project Manager, Quantity Surveyor, Technical Coordinator. Map their sector to one of: Main Contractor, Civil Engineering, Fit Out & Refurbishment, Residential Development, Consultancy, Specialist Contractor.

BEAT 2 — THE DETAIL (target: 2 exchanges)
Cover logistics naturally across two exchanges:
Exchange A: Location preference and notice period or availability to start.
Exchange B: Current salary, target salary, and whether they are looking for permanent, contract, or open to both. Frame these as a natural pair — e.g. "And on the commercial side, where are you currently sitting salary-wise, and what would the right move look like in terms of package and contract type?"

BEAT 3 — THE CLOSE (target: 2 exchanges)
Exchange A: One open qualitative question about what the right opportunity looks like — e.g. "What's prompting the move, and what does the ideal next step look like for you?" This captures motivation and aspiration in one.
Exchange B: Prompt them to drop their CV with a warm line like "Last thing from me — if you have your CV handy, drop it below and we'll get everything over to your consultant." Then close warmly: thank them, tell them their dedicated consultant will be in touch shortly, and let them know you're finding their matches now.

## TOTAL MESSAGE COUNT
Maximum 8 messages from you across the whole conversation. Be efficient. If a candidate gives rich answers, move faster. Never linger.

## TONE RULES
- Sound human, warm, and sector-literate. Reference construction naturally.
- Never use bullet points or numbered lists in your messages.
- Never say "Great!" or "Absolutely!" — vary your affirmations and keep them understated.
- Do not repeat information back to the candidate verbatim.
- Keep each message concise — 2 to 4 sentences maximum.

## CONTACT DETAILS
At some point before Beat 2, naturally ask for their name and best contact details (email and phone) if they have not already provided them. Weave this in — e.g. after their intro: "Before we go further, I don't think I caught your name — and what's the best email and number to reach you on?"

## CV UPLOAD SIGNAL
When you reach Beat 3 Exchange B and want the candidate to upload their CV, include the exact token [SHOW_CV_UPLOAD] at the end of your message. The interface will render a drag-and-drop upload zone when it sees this token. After they upload (or skip), they will reply confirming, and you should then close warmly and output the final JSON.

## FINAL OUTPUT
When the CV has been acknowledged (or skipped), output one final message to the candidate closing warmly. Then, on a new line, output ONLY the following JSON block and nothing else after it:

<CANDIDATE_DATA>
{
  "name": "",
  "email": "",
  "phone": "",
  "currentRole": "",
  "employer": "",
  "specialism": "",
  "sector": "",
  "yearsExperience": 0,
  "employmentType": "",
  "locationPreference": "",
  "noticePeriod": "",
  "currentSalary": "",
  "targetSalary": "",
  "reasonForLooking": "",
  "aspirations": "",
  "cvFilename": "",
  "recruiterMatch": "",
  "jobMatches": ["", "", ""]
}
</CANDIDATE_DATA>

For recruiterMatch, choose exactly one name from: James Hartley, Sophie Renshaw, Marcus Webb, Priya Anand using these rules:
- James Hartley → specialism is Project Manager, Contracts Manager, or Foreman; or sector is Main Contractor
- Sophie Renshaw → specialism is Quantity Surveyor, Estimator, Buyer, or Consultant; or sector is Consultancy
- Marcus Webb → specialism is Civil Engineer, Planner, or Health & Safety; or sector is Civil Engineering
- Priya Anand → specialism is Design Manager or Technical Coordinator; or sector is Fit Out & Refurbishment or Residential Development

For jobMatches, pick the 3 most relevant job titles from this list based on specialism, sector, location, and seniority:

Senior Project Manager | Central London | £75,000–£90,000 | Main Contractor
Quantity Surveyor | Hertfordshire | £55,000–£70,000 | Residential Development
Civil Engineer | West Sussex | £50,000–£65,000 | Civil Engineering
Contracts Manager | South London | £70,000–£85,000 | Fit Out & Refurbishment
Design Manager | East London | £65,000–£80,000 | Main Contractor
Estimator | Birmingham | £50,000–£60,000 | Specialist Contractor
Site Foreman | Surrey | £45,000–£55,000 | Main Contractor
Health & Safety Manager | London | £55,000–£65,000 | Consultancy
Planner | Oxford | £60,000–£75,000 | Civil Engineering
Buyer | West London | £45,000–£58,000 | Residential Development
Technical Coordinator | Kent | £48,000–£62,000 | Fit Out & Refurbishment
Consultant (QS) | City of London | £65,000–£85,000 | Consultancy`;

  // ============================================================
  // STATE
  // ============================================================
  const messages = []; // conversation history sent to Claude
  const candidateState = {
    cvFilename: ''
  };
  let isProcessing = false;
  let conversationComplete = false;

  // ============================================================
  // DOM refs
  // ============================================================
  const chatWindow = document.getElementById('chatWindow');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');

  // ============================================================
  // UI helpers
  // ============================================================
  function scrollToBottom() {
    requestAnimationFrame(() => {
      chatWindow.scrollTop = chatWindow.scrollHeight;
    });
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function renderUserMessage(text) {
    const wrap = document.createElement('div');
    wrap.className = 'msg user';
    wrap.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
    chatWindow.appendChild(wrap);
    scrollToBottom();
  }

  function renderAiMessage(text) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ai';
    const paragraphs = text
      .split(/\n+/)
      .filter(p => p.trim().length > 0)
      .map(p => `<p>${escapeHtml(p)}</p>`)
      .join('');
    wrap.innerHTML = `<div class="bubble">${paragraphs}</div>`;
    chatWindow.appendChild(wrap);
    scrollToBottom();
  }

  function showTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'msg ai';
    wrap.id = 'typingIndicator';
    wrap.innerHTML = `
      <div class="typing">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>`;
    chatWindow.appendChild(wrap);
    scrollToBottom();
  }

  function hideTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  function renderCvUpload() {
    const wrap = document.createElement('div');
    wrap.className = 'msg ai';
    wrap.id = 'cvUploadMsg';
    wrap.innerHTML = `
      <div class="cv-upload">
        <div class="cv-dropzone" id="cvDropzone">
          <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <div class="label">Drop your CV here or click to browse</div>
          <div class="hint">Any file type — we'll pass it to your consultant</div>
          <input type="file" id="cvFileInput" style="display:none;" />
        </div>
        <button class="cv-skip" id="cvSkipBtn">Skip — I'll send it later</button>
      </div>
    `;
    chatWindow.appendChild(wrap);
    scrollToBottom();

    const dropzone = document.getElementById('cvDropzone');
    const fileInput = document.getElementById('cvFileInput');
    const skipBtn = document.getElementById('cvSkipBtn');

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', e => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', e => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file) handleCvSelected(file.name);
    });
    fileInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (file) handleCvSelected(file.name);
    });
    skipBtn.addEventListener('click', () => handleCvSkipped());
  }

  function handleCvSelected(filename) {
    candidateState.cvFilename = filename;
    const msg = document.getElementById('cvUploadMsg');
    if (msg) {
      msg.innerHTML = `
        <div class="cv-upload">
          <div class="cv-uploaded">
            <div class="cv-tick">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </div>
            <div class="cv-filename">${escapeHtml(filename)}</div>
          </div>
        </div>
      `;
    }
    // Auto-send a confirmation message
    sendMessage(`I've uploaded my CV: ${filename}`, false);
  }

  function handleCvSkipped() {
    candidateState.cvFilename = '';
    const msg = document.getElementById('cvUploadMsg');
    if (msg) msg.remove();
    sendMessage(`I'll send my CV across later — please continue.`, false);
  }

  function renderFinalLoader() {
    const wrap = document.createElement('div');
    wrap.className = 'finalizing';
    wrap.innerHTML = `
      <div class="ring"></div>
      <div class="text">Finding your best matches…</div>
    `;
    chatWindow.appendChild(wrap);
    scrollToBottom();
  }

  // ============================================================
  // Parsing
  // ============================================================
  function extractCandidateData(text) {
    const match = text.match(/<CANDIDATE_DATA>([\s\S]*?)<\/CANDIDATE_DATA>/);
    if (!match) return null;
    try {
      return JSON.parse(match[1].trim());
    } catch (err) {
      console.error('Failed to parse CANDIDATE_DATA JSON:', err);
      return null;
    }
  }

  function stripDataBlock(text) {
    return text.replace(/<CANDIDATE_DATA>[\s\S]*?<\/CANDIDATE_DATA>/g, '').trim();
  }

  function hasCvUploadSignal(text) {
    return /\[SHOW_CV_UPLOAD\]/.test(text);
  }

  function stripCvUploadSignal(text) {
    return text.replace(/\[SHOW_CV_UPLOAD\]/g, '').trim();
  }

  // ============================================================
  // Claude API call — via our /api/chat serverless proxy
  // ============================================================
  async function callClaude() {
    const body = {
      model: ANTHROPIC_MODEL,
      max_tokens: 1000,
      system: SYSTEM_PROMPT,
      messages: messages
    };

    const res = await fetch(CHAT_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    if (!res.ok) {
      const errText = await res.text();
      throw new Error(`API error ${res.status}: ${errText}`);
    }

    const data = await res.json();
    const textBlock = data.content.find(b => b.type === 'text');
    return textBlock ? textBlock.text : '';
  }

  // ============================================================
  // Send flow
  // ============================================================
  async function sendMessage(text, alsoRender = true) {
    if (isProcessing || conversationComplete) return;
    const trimmed = text.trim();
    if (!trimmed) return;

    isProcessing = true;
    setInputEnabled(false);

    if (alsoRender) {
      renderUserMessage(trimmed);
    }
    messages.push({ role: 'user', content: trimmed });

    showTyping();

    try {
      const aiText = await callClaude();
      hideTyping();

      messages.push({ role: 'assistant', content: aiText });

      // Check for the final data block
      const candidateData = extractCandidateData(aiText);
      const cleanedText = stripCvUploadSignal(stripDataBlock(aiText));

      if (cleanedText) renderAiMessage(cleanedText);

      if (candidateData) {
        // Merge CV filename from local state if model left it blank
        if (!candidateData.cvFilename && candidateState.cvFilename) {
          candidateData.cvFilename = candidateState.cvFilename;
        }
        localStorage.setItem('cityscapeCandidate', JSON.stringify(candidateData));
        conversationComplete = true;
        setInputEnabled(false);
        renderFinalLoader();
        setTimeout(() => {
          window.location.href = 'results.html';
        }, 2500);
        return;
      }

      // CV upload signal
      if (hasCvUploadSignal(aiText)) {
        renderCvUpload();
      }

      isProcessing = false;
      setInputEnabled(true);
      messageInput.focus();
    } catch (err) {
      hideTyping();
      console.error(err);
      renderAiMessage(
        "Sorry — I hit a brief hiccup connecting. Please try sending that again."
      );
      isProcessing = false;
      setInputEnabled(true);
    }
  }

  function setInputEnabled(enabled) {
    messageInput.disabled = !enabled;
    sendBtn.disabled = !enabled;
  }

  // ============================================================
  // Event wiring
  // ============================================================
  sendBtn.addEventListener('click', () => {
    const text = messageInput.value;
    if (!text.trim()) return;
    messageInput.value = '';
    sendMessage(text, true);
  });

  messageInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const text = messageInput.value;
      if (!text.trim()) return;
      messageInput.value = '';
      sendMessage(text, true);
    }
  });

  // ============================================================
  // Kick off conversation
  // ============================================================
  async function startConversation() {
    isProcessing = true;
    setInputEnabled(false);
    showTyping();

    // Seed with a minimal user message so Claude opens warmly
    messages.push({
      role: 'user',
      content: '[The candidate has just opened the chat. Greet them and begin the intake.]'
    });

    try {
      const aiText = await callClaude();
      hideTyping();
      messages.push({ role: 'assistant', content: aiText });
      const cleaned = stripCvUploadSignal(stripDataBlock(aiText));
      if (cleaned) renderAiMessage(cleaned);
      if (hasCvUploadSignal(aiText)) renderCvUpload();
      isProcessing = false;
      setInputEnabled(true);
      messageInput.focus();
    } catch (err) {
      hideTyping();
      console.error(err);
      renderAiMessage(
        "Welcome to Cityscape AI. I'm having a momentary issue connecting — please send a message to try again."
      );
      // Remove the seed so the next user message starts fresh
      messages.length = 0;
      isProcessing = false;
      setInputEnabled(true);
    }
  }

  // Auto-start
  window.addEventListener('load', startConversation);
</script>

</body>
</html>
