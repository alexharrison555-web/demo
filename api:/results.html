<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Matches — Cityscape AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ---------- Tokens ---------- */
  :root {
    --green: #4a7c59;
    --green-hover: #3d6b4a;
    --green-soft: rgba(74, 124, 89, 0.08);
    --charcoal: #1a2332;
    --white: #ffffff;
    --bg: #f5f5f5;
    --grey-100: #ececec;
    --grey-200: #d8d8d8;
    --grey-400: #8a8f97;
    --grey-600: #4a4f57;
    --shadow-card: 0 1px 2px rgba(26, 35, 50, 0.04), 0 4px 16px rgba(26, 35, 50, 0.06);
    --shadow-card-hover: 0 4px 8px rgba(26, 35, 50, 0.06), 0 12px 32px rgba(26, 35, 50, 0.10);
    --shadow-header: 0 1px 0 rgba(26, 35, 50, 0.06);
    --radius: 14px;
    --radius-sm: 10px;
    --header-h: 68px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 400;
    color: var(--charcoal);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.5;
  }

  /* ---------- Header ---------- */
  .header {
    position: sticky;
    top: 0;
    height: var(--header-h);
    background: var(--white);
    box-shadow: var(--shadow-header);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    z-index: 100;
  }
  .logo {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--charcoal);
    text-decoration: none;
  }
  .logo .accent { color: var(--green); }
  .tagline {
    font-size: 14px;
    font-weight: 500;
    color: var(--green);
    letter-spacing: 0.01em;
  }

  /* ---------- Page container ---------- */
  .page {
    padding: 56px 28px 80px;
    max-width: 1200px;
    margin: 0 auto;
  }

  /* ---------- Error state ---------- */
  .error-state {
    text-align: center;
    padding: 80px 24px;
    animation: fadeIn 0.5s var(--ease);
  }
  .error-state h2 {
    font-size: 24px;
    font-weight: 600;
    color: var(--charcoal);
    margin: 0 0 12px;
    letter-spacing: -0.01em;
  }
  .error-state p {
    color: var(--grey-600);
    margin: 0 0 24px;
    font-size: 15px;
  }
  .error-state a {
    display: inline-block;
    background: var(--green);
    color: white;
    text-decoration: none;
    padding: 12px 24px;
    border-radius: 24px;
    font-weight: 500;
    font-size: 14px;
    transition: all 0.2s var(--ease);
  }
  .error-state a:hover {
    background: var(--green-hover);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(74, 124, 89, 0.25);
  }

  /* ---------- Section heading ---------- */
  .section-heading {
    text-align: center;
    margin-bottom: 40px;
    animation: fadeUp 0.6s var(--ease) backwards;
  }
  .section-heading h2 {
    font-size: 32px;
    font-weight: 600;
    color: var(--charcoal);
    margin: 0 0 10px;
    letter-spacing: -0.02em;
  }
  .section-heading p {
    font-size: 16px;
    color: var(--grey-600);
    margin: 0;
    max-width: 560px;
    margin-left: auto;
    margin-right: auto;
  }

  /* ---------- Job cards ---------- */
  .jobs-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
    margin-bottom: 8px;
  }
  .job-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 26px 24px;
    box-shadow: var(--shadow-card);
    display: flex;
    flex-direction: column;
    transition: all 0.3s var(--ease);
    animation: fadeUp 0.6s var(--ease) backwards;
  }
  .job-card:nth-child(1) { animation-delay: 0.1s; }
  .job-card:nth-child(2) { animation-delay: 0.2s; }
  .job-card:nth-child(3) { animation-delay: 0.3s; }
  .job-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-card-hover);
  }
  .job-sector {
    display: inline-block;
    background: var(--green);
    color: white;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.02em;
    padding: 5px 11px;
    border-radius: 999px;
    margin-bottom: 16px;
    align-self: flex-start;
    text-transform: uppercase;
  }
  .job-title {
    font-size: 19px;
    font-weight: 600;
    color: var(--charcoal);
    margin: 0 0 10px;
    letter-spacing: -0.01em;
    line-height: 1.3;
  }
  .job-location {
    font-size: 14px;
    color: var(--grey-600);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .job-salary {
    font-size: 16px;
    font-weight: 600;
    color: var(--green);
    margin-bottom: 16px;
  }
  .job-description {
    font-size: 14px;
    color: var(--grey-600);
    line-height: 1.55;
    flex: 1;
    margin-bottom: 22px;
  }
  .job-cta {
    display: inline-block;
    text-align: center;
    background: var(--green);
    color: white;
    text-decoration: none;
    padding: 11px 18px;
    border-radius: 24px;
    font-weight: 500;
    font-size: 14px;
    transition: all 0.2s var(--ease);
  }
  .job-cta:hover {
    background: var(--green-hover);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(74, 124, 89, 0.25);
  }

  /* ---------- Divider ---------- */
  .divider {
    border: none;
    height: 1px;
    background: var(--grey-200);
    margin: 72px 0 56px;
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
  }

  /* ---------- Recruiter card ---------- */
  .recruiter-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 40px 36px;
    box-shadow: var(--shadow-card);
    max-width: 560px;
    margin: 0 auto;
    text-align: center;
    animation: fadeUp 0.6s var(--ease) backwards;
    animation-delay: 0.4s;
  }
  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: var(--green);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 auto 22px;
    box-shadow: 0 4px 16px rgba(74, 124, 89, 0.25);
    animation: avatarPop 0.7s var(--ease) backwards;
    animation-delay: 0.5s;
  }
  @keyframes avatarPop {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .recruiter-name {
    font-size: 24px;
    font-weight: 600;
    color: var(--charcoal);
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .recruiter-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--green);
    margin: 0 0 20px;
  }
  .recruiter-bio {
    font-size: 14.5px;
    color: var(--grey-600);
    line-height: 1.6;
    margin: 0 0 22px;
    text-align: left;
  }
  .recruiter-email {
    display: inline-block;
    color: var(--charcoal);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 22px;
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--green-soft);
    transition: all 0.2s var(--ease);
  }
  .recruiter-email:hover {
    background: rgba(74, 124, 89, 0.14);
  }
  .recruiter-cta {
    display: inline-block;
    background: var(--green);
    color: white;
    text-decoration: none;
    padding: 13px 32px;
    border-radius: 26px;
    font-weight: 500;
    font-size: 15px;
    transition: all 0.2s var(--ease);
  }
  .recruiter-cta:hover {
    background: var(--green-hover);
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(74, 124, 89, 0.28);
  }

  /* ---------- Animations ---------- */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* ---------- Mobile ---------- */
  @media (max-width: 900px) {
    .jobs-grid {
      grid-template-columns: 1fr;
      gap: 18px;
    }
  }
  @media (max-width: 640px) {
    :root { --header-h: 60px; }
    .header { padding: 0 18px; }
    .logo { font-size: 19px; }
    .tagline { font-size: 12px; }
    .page { padding: 40px 18px 60px; }
    .section-heading h2 { font-size: 26px; }
    .section-heading p { font-size: 15px; }
    .divider { margin: 56px 0 44px; }
    .recruiter-card { padding: 32px 24px; }
    .recruiter-cta { display: block; width: 100%; }
    .avatar { width: 84px; height: 84px; font-size: 30px; }
    .recruiter-name { font-size: 22px; }
  }
</style>
</head>
<body>

<header class="header">
  <a href="index.html" class="logo">Cityscape<span class="accent">AI</span></a>
  <div class="tagline">Your AI Recruiter</div>
</header>

<main class="page" id="page"></main>

<script>
  // ============================================================
  // Job slug mapping
  // ============================================================
  const JOB_SLUGS = {
    "Senior Project Manager": "project-manager",
    "Quantity Surveyor": "quantity-surveyor",
    "Civil Engineer": "civil-engineer",
    "Contracts Manager": "contracts-manager",
    "Design Manager": "design-manager",
    "Estimator": "estimator",
    "Site Foreman": "foreman",
    "Health & Safety Manager": "health-and-safety",
    "Planner": "planner",
    "Buyer": "buyer",
    "Technical Coordinator": "technical-coordinator",
    "Consultant (QS)": "consultant"
  };

  // ============================================================
  // Full job data lookup
  // ============================================================
  const JOB_DATA = {
    "Senior Project Manager": {
      location: "Central London",
      salary: "£75,000–£90,000",
      sector: "Main Contractor",
      description: "Lead complex commercial builds for a Tier 1 main contractor delivering landmark projects across the capital. Ideal for a PM with 8+ years experience and a track record on schemes above £20m."
    },
    "Quantity Surveyor": {
      location: "Hertfordshire",
      salary: "£55,000–£70,000",
      sector: "Residential Development",
      description: "Join a well-regarded residential developer managing cost on a pipeline of new-build schemes across the Home Counties. Strong commercial team and clear progression path."
    },
    "Civil Engineer": {
      location: "West Sussex",
      salary: "£50,000–£65,000",
      sector: "Civil Engineering",
      description: "Site-based civil engineering role on a major infrastructure project with a leading civils contractor. Groundworks, drainage, and structures experience beneficial."
    },
    "Contracts Manager": {
      location: "South London",
      salary: "£70,000–£85,000",
      sector: "Fit Out & Refurbishment",
      description: "Oversee multiple live fit out schemes simultaneously for a specialist contractor with a strong pipeline of commercial refurbishment work across South and Central London."
    },
    "Design Manager": {
      location: "East London",
      salary: "£65,000–£80,000",
      sector: "Main Contractor",
      description: "Coordinate design across all disciplines on a large mixed-use development in East London. You'll work closely with architects, engineers, and the project team from RIBA Stage 3 through to completion."
    },
    "Estimator": {
      location: "Birmingham",
      salary: "£50,000–£60,000",
      sector: "Specialist Contractor",
      description: "Prepare detailed tenders for a specialist M&E contractor winning work across the Midlands and nationally. Strong opportunity for someone looking to step into a senior estimating position."
    },
    "Site Foreman": {
      location: "Surrey",
      salary: "£45,000–£55,000",
      sector: "Main Contractor",
      description: "Day-to-day site supervision on a residential-led scheme in Surrey with a well-established regional contractor. Stable pipeline of work and a collaborative site team."
    },
    "Health & Safety Manager": {
      location: "London",
      salary: "£55,000–£65,000",
      sector: "Consultancy",
      description: "Provide CDM and H&S advisory services across a diverse portfolio of construction projects for a growing consultancy. NEBOSH qualified candidates strongly preferred."
    },
    "Planner": {
      location: "Oxford",
      salary: "£60,000–£75,000",
      sector: "Civil Engineering",
      description: "Develop and maintain programmes for a civils contractor delivering utilities and highways schemes across the South East. Primavera P6 or Asta experience required."
    },
    "Buyer": {
      location: "West London",
      salary: "£45,000–£58,000",
      sector: "Residential Development",
      description: "Manage procurement of materials and subcontractors for a residential developer with an active build programme in West London and the surrounding areas."
    },
    "Technical Coordinator": {
      location: "Kent",
      salary: "£48,000–£62,000",
      sector: "Fit Out & Refurbishment",
      description: "Coordinate technical information packages and manage RFI processes on high-spec commercial fit out projects in Kent and South East London."
    },
    "Consultant (QS)": {
      location: "City of London",
      salary: "£65,000–£85,000",
      sector: "Consultancy",
      description: "PQS role within a respected cost consultancy advising developer and investor clients on schemes across the City and wider London market. APC support available."
    }
  };

  // ============================================================
  // Recruiter data
  // ============================================================
  const RECRUITERS = {
    "James Hartley": {
      title: "Senior Consultant – Project & Contracts Management",
      email: "james.hartley@cityscapeltd.com",
      bio: "James has 8 years placing project and contracts managers across London's top main contractors. He has an exceptional network across Tier 1 and Tier 2 build environments and a strong track record of making moves that genuinely advance careers. He'll cut straight to the opportunities worth your time."
    },
    "Sophie Renshaw": {
      title: "Senior Consultant – Cost & Commercial",
      email: "sophie.renshaw@cityscapeltd.com",
      bio: "Sophie specialises in commercial and cost management roles, with 7 years building relationships across London's leading QS practices and developer teams. She understands what good looks like at every level and will help you find the right balance of project, culture, and package."
    },
    "Marcus Webb": {
      title: "Consultant – Civil & Infrastructure",
      email: "marcus.webb@cityscapeltd.com",
      bio: "Marcus focuses exclusively on civil engineering and infrastructure, working with contractor and consultancy clients across the UK. With a background in civil engineering himself, he understands the work — not just the job titles — and will match you with projects worth being proud of."
    },
    "Priya Anand": {
      title: "Consultant – Design, Technical & Fit Out",
      email: "priya.anand@cityscapeltd.com",
      bio: "Priya specialises in placing design managers, technical coordinators, and fit out professionals with some of London's most respected refurbishment and residential developers. She takes time to understand your ambitions properly before she picks up the phone to any client."
    }
  };

  // ============================================================
  // Helpers
  // ============================================================
  function escapeHtml(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function getInitials(name) {
    return name
      .split(/\s+/)
      .filter(Boolean)
      .map(p => p[0])
      .slice(0, 2)
      .join('')
      .toUpperCase();
  }

  function getJobSlug(title) {
    return JOB_SLUGS[title] || title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  }

  // ============================================================
  // Renderers
  // ============================================================
  function renderError() {
    const page = document.getElementById('page');
    page.innerHTML = `
      <div class="error-state">
        <h2>Something went wrong</h2>
        <p>We couldn't find your profile. Please start again — it only takes a couple of minutes.</p>
        <a href="index.html">Start again</a>
      </div>
    `;
  }

  function renderJobCard(jobTitle) {
    const job = JOB_DATA[jobTitle];
    if (!job) return '';
    const slug = getJobSlug(jobTitle);
    const url = `https://www.cityscapeltd.com/job-role/${slug}`;
    return `
      <article class="job-card">
        <span class="job-sector">${escapeHtml(job.sector)}</span>
        <h3 class="job-title">${escapeHtml(jobTitle)}</h3>
        <div class="job-location">📍 ${escapeHtml(job.location)}</div>
        <div class="job-salary">${escapeHtml(job.salary)}</div>
        <p class="job-description">${escapeHtml(job.description)}</p>
        <a class="job-cta" href="${url}" target="_blank" rel="noopener">View Role</a>
      </article>
    `;
  }

  function renderResults(data) {
    const page = document.getElementById('page');

    // ---- Jobs section ----
    const jobs = Array.isArray(data.jobMatches) ? data.jobMatches.filter(t => t && JOB_DATA[t]) : [];

    // If we don't have 3 valid jobs, top up with sensible defaults so the page always renders fully
    const fallbackOrder = [
      "Senior Project Manager",
      "Quantity Surveyor",
      "Civil Engineer",
      "Contracts Manager",
      "Design Manager"
    ];
    for (const fb of fallbackOrder) {
      if (jobs.length >= 3) break;
      if (!jobs.includes(fb)) jobs.push(fb);
    }
    const topThree = jobs.slice(0, 3);

    // ---- Recruiter section ----
    const recruiterName = data.recruiterMatch && RECRUITERS[data.recruiterMatch]
      ? data.recruiterMatch
      : "James Hartley"; // sensible default
    const recruiter = RECRUITERS[recruiterName];
    const initials = getInitials(recruiterName);
    const calendlySubject = encodeURIComponent(`Introduction call — ${data.name || 'New candidate'}`);
    const calendlyBody = encodeURIComponent(
      `Hi ${recruiterName.split(' ')[0]},\n\nI just completed the Cityscape AI intake and would like to book an introduction call.\n\nThanks,\n${data.name || ''}`
    );

    page.innerHTML = `
      <section>
        <div class="section-heading">
          <h2>Roles matched for you</h2>
          <p>Based on your profile, here are three opportunities worth exploring.</p>
        </div>
        <div class="jobs-grid">
          ${topThree.map(renderJobCard).join('')}
        </div>
      </section>

      <hr class="divider" />

      <section>
        <div class="section-heading">
          <h2>Meet your dedicated consultant</h2>
          <p>They'll be in touch shortly — here's a little about them.</p>
        </div>
        <div class="recruiter-card">
          <div class="avatar">${escapeHtml(initials)}</div>
          <h3 class="recruiter-name">${escapeHtml(recruiterName)}</h3>
          <div class="recruiter-title">${escapeHtml(recruiter.title)}</div>
          <p class="recruiter-bio">${escapeHtml(recruiter.bio)}</p>
          <a class="recruiter-email" href="mailto:${escapeHtml(recruiter.email)}">${escapeHtml(recruiter.email)}</a>
          <br />
          <a class="recruiter-cta" href="mailto:${escapeHtml(recruiter.email)}?subject=${calendlySubject}&body=${calendlyBody}">Book an Introduction Call</a>
        </div>
      </section>
    `;
  }

  // ============================================================
  // Boot
  // ============================================================
  function init() {
    const raw = localStorage.getItem('cityscapeCandidate');
    if (!raw) {
      renderError();
      return;
    }
    try {
      const data = JSON.parse(raw);
      if (!data || typeof data !== 'object') {
        renderError();
        return;
      }
      renderResults(data);
    } catch (err) {
      console.error('Failed to parse candidate data:', err);
      renderError();
    }
  }

  window.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
